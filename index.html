<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MyShop</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }
        header {
            background: black;
            color: white;
            padding: 20px;
        }
        .card {
            background: white;
            margin: 20px auto;
            padding: 15px;
            width: 220px;
            border-radius: 10px;
        }
        img {
            width: 100%;
            border-radius: 10px;
        }
        button {
            background: orange;
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>MyShop 🛍️</h1>
    <p>Cash on Delivery Available</p>
</header>

<div class="card">
    <h2>Stylish Shirt</h2>
    <img src="https://via.placeholder.com/200">
    <p>৳ 850</p>
    <button onclick="alert('Order received! We will contact you.')">
        Order Now
    </button>
</div>

<div class="card">
    <h2>Smart Watch</h2>
    <img src="https://via.placeholder.com/200">
    <p>৳ 1200</p>
    <button onclick="alert('Order received! We will contact you.')">
        Order Now
    </button>
</div>

</body>
</html>
